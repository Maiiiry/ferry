name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        # 1.88 is package.rust-version in Cargo.toml; bump both together.
        rust: [stable, "1.88"]
        include:
          # auto freshness selects checksum freshness on nightly toolchains.
          - os: ubuntu-24.04
            rust: nightly
    runs-on: ${{ matrix.os }}
    # Nightly can break independently of this repository: a failure here does not
    # fail the workflow, and this leg must not be a required check.
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1, which
      # makes the mount step after unshare(CLONE_NEWUSER) fail with EPERM. Fail
      # here rather than let the namespace and overlay tests skip.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true
      # rust-toolchain and rust-cache export CARGO_INCREMENTAL=0 through
      # GITHUB_ENV, which would switch off the incremental reuse the tests check.
      - name: cargo test
        env:
          # Fail instead of skipping tests when a capability these runners
          # have goes undetected.
          FERRY_TEST_REQUIRE: ${{ runner.os == 'Linux' && 'userns,overlay,clippy' || 'reflink,clippy' }}
        run: |
          unset CARGO_INCREMENTAL
          cargo test --locked

  # Keeps Ubuntu's default AppArmor userns restriction on and checks that the
  # profile from `ferry doctor --apparmor-profile` is enough for the sandbox.
  apparmor:
    name: test (ubuntu-24.04, AppArmor profile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ferry with its AppArmor profile
        run: |
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          cargo build --locked
          sudo install -m 755 target/debug/ferry /usr/local/bin/ferry
          /usr/local/bin/ferry doctor --apparmor-profile | sudo tee /etc/apparmor.d/ferry
          sudo apparmor_parser -r /etc/apparmor.d/ferry
      - name: cargo test (sandbox tests through the profiled binary)
        env:
          FERRY_TEST_BIN: /usr/local/bin/ferry
          FERRY_TEST_REQUIRE: userns,overlay,clippy
        run: |
          unset CARGO_INCREMENTAL
          cargo test --locked --test spawn --test isolation --test concurrency --test contamination --test shim --test warm

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny --locked check

  typos:
    name: typos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
