name: Bug report
description: Ferry does something wrong, crashes, or gives a wrong build
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please report security issues privately instead: see [SECURITY.md](https://github.com/patwrall/ferry/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead. Paste the full output, including any `hint:` lines.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ferry base
        2. ferry spawn agent-1
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ferry version
      description: Output of `ferry --version`.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: ferry doctor
      description: Output of `ferry doctor --json`, run in the affected repository. It shows the platform, filesystem, namespace and reflink support, and toolchain.
      render: json
    validations:
      required: true
  - type: input
    id: agent-tool
    attributes:
      label: Agent tool
      description: The coding agent driving Ferry, if any, and its version.
      placeholder: Claude Code, Codex CLI, none
